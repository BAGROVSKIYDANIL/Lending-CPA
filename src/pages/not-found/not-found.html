<main
  class="not-found"
  [attr.aria-label]="isRussian ? '404 — Страница не найдена' : '404 — Page not found'"
>
    <picture class="not-found__code">
        <source media="(min-width: 450px)" srcset="/assets/images/404-vertical.png">
        <source media="(min-width: 768px)" srcset="/assets/images/404-gorizontal.png">
        <img src="/assets/images/404-vertical.png" alt="404 - Page not found">
    </picture>
  <a class="not-found__button button button--3d" routerLink="/">
    <span>TAKE ME BACK</span>
  </a>
  <div class="not-found__snake"></div>
</main>

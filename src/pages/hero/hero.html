            <span class="title__wrapper">makes
            @if (!viewport.isMobile()) { <span class="title__viewport">
                <span class="title__words">
                <span class="title__word">profit</span>
                <span class="title__word">growth</span>
                <span class="title__word">skills</span>
                </span>
                </span> } @else {

        <button class="button button--3d">get in touch</button>

    @if (!viewport.isMobile()) {
        <app-socials />
    }

<ul class="nav">
  @if (viewport.isMobile()) {
    <li class="nav__item">
      <a
        [routerLink]="['/', languageService.language()]"
        fragment="hero"
        class="nav__link"
        target="_self"
        >{{ 'header.links.main' | translate }}</a
      >
    </li>
  }
  @let language = languageService.language();
  @for (route of navRoutes; track route) {
    <li class="nav__item">
      <a
        class="nav__link"
        target="_self"
        [routerLink]="['/', language]"
        [fragment]="route.fragment"
        >{{ 'header.links.' + route.label | translate }}</a
      >
    </li>
  }
</ul>
